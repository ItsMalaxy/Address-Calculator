<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Memory Address Calculator</title>
<style>
    :root {
        --bg:        #0a0f0c;
        --panel:     #121813;
        --panel-2:   #0e1310;
        --border:    #23302a;
        --text:      #cfe8d8;
        --muted:     #5f7a6c;
        --green:     #00ff9c;
        --green-dim: #0a8f5c;
        --amber:     #ffb000;
        --red:       #ff4757;
    }

    * { box-sizing: border-box; }

    body {
        font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
        background: var(--bg);
        color: var(--text);
        padding: 24px;
        margin: 0;
        background-image:
            repeating-linear-gradient(
                0deg,
                rgba(0,255,156,0.015) 0px,
                rgba(0,255,156,0.015) 1px,
                transparent 1px,
                transparent 3px
            );
    }

    .container {
        max-width: 760px;
        margin: auto;
    }

    header {
        display: flex;
        align-items: baseline;
        gap: 10px;
        margin-bottom: 4px;
        border-bottom: 1px solid var(--border);
        padding-bottom: 14px;
    }

    h1 {
        color: var(--green);
        font-size: 20px;
        letter-spacing: 0.5px;
        margin: 0;
        font-weight: 700;
    }

    h1::after {
        content: "_";
        animation: blink 1.1s steps(1) infinite;
        color: var(--amber);
    }

    @keyframes blink { 50% { opacity: 0; } }

    .subtitle {
        color: var(--muted);
        font-size: 12px;
        margin: 4px 0 20px;
        letter-spacing: 0.5px;
    }

    .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 16px 18px;
        margin-bottom: 16px;
    }

    .label {
        color: var(--amber);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        margin-bottom: 8px;
        display: block;
    }

    .row {
        display: flex;
        gap: 10px;
    }

    input {
        flex: 1;
        width: 100%;
        padding: 11px 12px;
        font-size: 15px;
        font-family: inherit;
        background: var(--panel-2);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 4px;
        outline: none;
        transition: border-color 0.15s ease;
    }

    input::placeholder { color: var(--muted); }

    input:focus {
        border-color: var(--green-dim);
    }

    input.valid {
        border-color: var(--green-dim);
    }

    input.invalid {
        border-color: var(--red);
    }

    button {
        padding: 11px 20px;
        font-size: 13px;
        font-family: inherit;
        font-weight: 600;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        cursor: pointer;
        background: transparent;
        border: 1px solid var(--green-dim);
        color: var(--green);
        border-radius: 4px;
        transition: background 0.15s ease, color 0.15s ease;
        white-space: nowrap;
    }

    button:hover {
        background: var(--green-dim);
        color: #05130c;
    }

    button:active {
        transform: translateY(1px);
    }

    .hint {
        color: var(--muted);
        font-size: 11px;
        margin-top: 6px;
    }

    .hint.error {
        color: var(--red);
    }

    #searchResult {
        font-size: 13px;
        line-height: 1.6;
        margin-top: 12px;
        color: var(--text);
    }

    #searchResult:empty { margin-top: 0; }

    .suggestions {
        position: absolute;
        top: calc(100% + 4px);
        left: 0;
        right: 96px;
        background: var(--panel-2);
        border: 1px solid var(--border);
        border-radius: 4px;
        max-height: 220px;
        overflow-y: auto;
        z-index: 10;
        display: none;
    }

    .suggestions.open { display: block; }

    .suggestion-item {
        padding: 9px 12px;
        font-size: 13px;
        cursor: pointer;
        color: var(--text);
        border-bottom: 1px solid var(--border);
    }

    .suggestion-item:last-child { border-bottom: none; }

    .suggestion-item:hover,
    .suggestion-item.active {
        background: var(--green-dim);
        color: #05130c;
    }

    .suggestion-item .num {
        color: var(--muted);
        margin-right: 6px;
        font-size: 11px;
    }

    .suggestion-item:hover .num,
    .suggestion-item.active .num {
        color: #05130c;
        opacity: 0.7;
    }

    .result-entry {
        border-left: 2px solid var(--green-dim);
        padding: 6px 0 6px 12px;
        margin-bottom: 8px;
        cursor: pointer;
        transition: background 0.15s ease;
        border-radius: 0 4px 4px 0;
    }

    .result-entry:hover {
        background: rgba(0,255,156,0.05);
    }

    .result-entry .name {
        color: var(--green);
        font-weight: 600;
    }

    .result-entry .addr {
        color: var(--text);
    }

    .era-dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-right: 7px;
    }

    .era-tag {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        opacity: 0.75;
        margin-left: 8px;
    }

    .output-box {
        width: 100%;
        max-height: 480px;
        overflow-y: auto;
        background: var(--panel-2);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 8px 6px;
        font-size: 13px;
    }

    .output-box:empty::before {
        content: "Results will appear here after you calculate.";
        color: var(--muted);
        display: block;
        padding: 10px 8px;
    }

    .output-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 6px 8px;
        border-radius: 4px;
        transition: background 0.4s ease;
    }

    .output-row:hover {
        background: rgba(0,255,156,0.05);
    }

    .output-row.flash {
        background: rgba(255,176,0,0.18);
    }

    .output-row .left {
        display: flex;
        align-items: center;
        overflow: hidden;
        white-space: nowrap;
    }

    .out-label {
        color: var(--muted);
        margin-right: 10px;
        flex-shrink: 0;
    }

    .out-addr {
        color: var(--green);
        font-weight: 500;
    }

    .output-divider {
        color: var(--amber);
        font-size: 11px;
        letter-spacing: 2px;
        text-transform: uppercase;
        padding: 16px 8px 8px;
        margin-top: 4px;
        border-bottom: 1px solid var(--border);
    }

    .copy-inline {
        padding: 2px 8px;
        font-size: 10px;
        margin-left: 8px;
    }

    .output-wrap {
        position: relative;
    }

    .output-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
    }

    footer {
        color: var(--muted);
        font-size: 11px;
        text-align: center;
        margin-top: 18px;
    }
</style>
</head>

<body>

<div class="container">

    <header>
        <h1>MEMORY ADDRESS CALCULATOR</h1>
    </header>

    <div class="panel">
        <label class="label" for="address">Credits Starting Address</label>
        <div class="row">
            <input id="address" placeholder="e.g. 7F6B4930F1E8" autocomplete="off" spellcheck="false">
            <button onclick="calculate()">Calculate</button>
        </div>
        <div class="hint" id="addressHint"></div>
    </div>

    <div class="panel">
        <label class="label" for="characterSearch">Search Character</label>
        <div class="row" style="position: relative;">
            <input id="characterSearch" placeholder="Character name" autocomplete="off" spellcheck="false">
            <button onclick="searchCharacter()">Search</button>
            <div id="suggestions" class="suggestions"></div>
        </div>
        <div id="searchResult"></div>
    </div>

    <div class="panel output-wrap">
        <div class="output-header">
            <label class="label" style="margin-bottom:0;">Output</label>
        </div>
        <div id="output" class="output-box"></div>
    </div>

    <footer>All addresses computed client-side. Nothing leaves this page.</footer>

</div>


<script>

let character1 = null;
let savedInputLength = 0;

const VALUE_SIZE = 4;

const RECHARGE_OFFSET = 90;
const SURVIVAL_OFFSET = 168;
const CHARACTER_1_OFFSET = 570;
const CHARACTER_SPACING = 35;

const DEAD_BLOCKS = [25, 43, 64, 78];

    148: "New 52 Black Adam"

function addValues(base, values) {
    return base + BigInt(values * VALUE_SIZE);
}

const ERA_RULES = [
    ["Blackest Night", "#7c5cff"],
    ["Injustice 2",    "#c14fff"],
    ["Suicide Squad",  "#ff5c8a"],
    ["Arkham Knight",  "#ffb000"],
    ["Arkham Origins", "#ff8c42"],
    ["Arkham",         "#ffb000"],
    ["Red Son",        "#ff4757"],
    ["New 52",         "#4fa8ff"],
    ["Man of Steel",   "#5ce1ff"],
    ["Teen Titans",    "#9dff5c"],
    ["Batman Ninja",   "#c1ff5c"],
    ["Insurgency",     "#ff7a45"],
    ["Regime",         "#ff4757"],
    ["Prime",          "#00ff9c"],
    ["Rebirth",        "#ffd35c"],
    ["Flashpoint",     "#5cffe1"],
    ["Earth 2",        "#5c8aff"]
];

function getEraTag(name) {
    for (const [keyword, color] of ERA_RULES) {
        if (name.includes(keyword)) {
            return { label: keyword, color: color };
        }
    }
    return { label: "Other", color: "#5f7a6c" };
}

function formatAddress(value, length) {
    let result = value.toString(16).toUpperCase();
    while (result.length < length) {
        result = "0" + result;
    }
    return result;
}

let lastCalculatedInput = null;
let lastOutputHTML = null;

function simpleRowHTML(rowId, label, addr) {
    const btnId = "copy_" + rowId;
    return '<div class="output-row" id="row_' + rowId + '">' +
        '<span class="left"><span class="out-label">' + label + '</span><span class="out-addr">' + addr + '</span></span>' +
        '<button class="copy-inline" id="' + btnId + '" onclick="copyText(\'' + addr + '\', document.getElementById(\'' + btnId + '\'))">Copy</button>' +
    '</div>';
}

function characterRowHTML(charId, name, addr) {
    const era = getEraTag(name);
    const btnId = "copy_char_" + charId;
    return '<div class="output-row" id="charrow_' + charId + '">' +
        '<span class="left">' +
            '<span class="era-dot" style="background:' + era.color + '"></span>' +
            '<span class="out-label">#' + charId + ' ' + name + '</span>' +
            '<span class="out-addr">' + addr + '</span>' +
        '</span>' +
        '<button class="copy-inline" id="' + btnId + '" onclick="copyText(\'' + addr + '\', document.getElementById(\'' + btnId + '\'))">Copy</button>' +
    '</div>';
}

function calculate() {

    const addressInput = document.getElementById("address");
    const hint = document.getElementById("addressHint");
    let input = addressInput.value.trim().replace(/^0x/i, "").toUpperCase();

    const output = document.getElementById("output");

    if (input.length > 0 && input === lastCalculatedInput) {
        output.innerHTML = lastOutputHTML;
        hint.textContent = "Calculated " + (148 - DEAD_BLOCKS.length) + " character addresses. (cached)";
        hint.classList.remove("error");
        return;
    }

    try {

        const base = BigInt("0x" + input);

        savedInputLength = input.length;

        const rows = [];

        rows.push(simpleRowHTML("credits", "Credits", formatAddress(base, input.length)));
        rows.push(simpleRowHTML("recharge", "Recharge Cards", formatAddress(addValues(base, RECHARGE_OFFSET), input.length)));
        rows.push(simpleRowHTML("survival", "Survival Tickets", formatAddress(addValues(base, SURVIVAL_OFFSET), input.length)));
        rows.push('<div class="output-divider">Characters</div>');

        character1 = addValues(base, CHARACTER_1_OFFSET);

        for (let i = 1; i <= 148; i++) {

            if (DEAD_BLOCKS.includes(i)) {
                continue;
            }

            const current = character1 + BigInt((i - 1) * CHARACTER_SPACING * VALUE_SIZE);
            const name = CHARACTER_NAMES[i] || "Unknown";
            const addrStr = formatAddress(current, input.length);

            rows.push(characterRowHTML(i, name, addrStr));
        }

        const finalHTML = rows.join("");
        output.innerHTML = finalHTML;

        hint.textContent = "Calculated " + (148 - DEAD_BLOCKS.length) + " character addresses.";
        hint.classList.remove("error");

        lastCalculatedInput = input;
        lastOutputHTML = finalHTML;

    } catch (error) {

        character1 = null;
        output.innerHTML = "";
        hint.textContent = "Invalid hexadecimal address. Digits 0-9 and A-F only.";
        hint.classList.add("error");

    }
}

function validateAddressField() {
    const field = document.getElementById("address");
    const val = field.value.trim().replace(/^0x/i, "");

    field.classList.remove("valid", "invalid");

    if (val.length === 0) return;

    if (/^[0-9A-Fa-f]+$/.test(val)) {
        field.classList.add("valid");
    } else {
        field.classList.add("invalid");
    }
}

function copyText(text, btn) {
    navigator.clipboard.writeText(text).then(() => {
        if (!btn) return;
        const original = btn.textContent;
        btn.textContent = "Copied";
        btn.classList.add("copied");
        setTimeout(() => {
            btn.textContent = original;
            btn.classList.remove("copied");
        }, 1200);
    });
}

function searchCharacter() {

    const search = document.getElementById("characterSearch").value.toLowerCase().trim();
    const searchWords = search.split(/\s+/).filter(Boolean);
    const resultBox = document.getElementById("searchResult");

    if (character1 === null) {
        resultBox.innerHTML = '<span style="color:var(--muted)">Calculate an address first.</span>';
        return;
    }

    if (searchWords.length === 0) {
        resultBox.innerHTML = '<span style="color:var(--muted)">Type a character name.</span>';
        return;
    }

    const entries = [];

    for (let i = 1; i <= 148; i++) {

        if (DEAD_BLOCKS.includes(i)) {
            continue;
        }

        const name = CHARACTER_NAMES[i];
        const nameLower = name ? name.toLowerCase() : "";

        const matchesAllWords = name
            ? searchWords.every(word => nameLower.includes(word))
            : false;

        if (matchesAllWords) {

            const characterAddress = character1 + BigInt((i - 1) * CHARACTER_SPACING * VALUE_SIZE);
            const addrStr = formatAddress(characterAddress, savedInputLength);
            const btnId = "copy_" + i;
            const era = getEraTag(name);

            entries.push(
                '<div class="result-entry" onclick="jumpToCharacter(' + i + ')">' +
                    '<span class="era-dot" style="background:' + era.color + '"></span>' +
                    '<span class="name">#' + i + ' - ' + name + '</span>' +
                    '<span class="era-tag" style="color:' + era.color + '">' + era.label + '</span><br>' +
                    '<span class="addr">' + addrStr + '</span>' +
                    '<button class="copy-inline" id="' + btnId + '" onclick="event.stopPropagation(); copyText(\'' + addrStr + '\', document.getElementById(\'' + btnId + '\'))">Copy</button>' +
                '</div>'
            );
        }
    }

    resultBox.innerHTML = entries.length
        ? entries.join("")
        : '<span style="color:var(--muted)">No characters found.</span>';
}

function jumpToCharacter(charId) {
    const row = document.getElementById("charrow_" + charId);
    if (!row) return;

    row.scrollIntoView({ behavior: "smooth", block: "center" });
    row.classList.add("flash");
    setTimeout(() => row.classList.remove("flash"), 1000);
}

document.getElementById("address").addEventListener("input", validateAddressField);

document.getElementById("address").addEventListener("keydown", function (e) {
    if (e.key === "Enter") calculate();
});

document.getElementById("characterSearch").addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
        const active = document.querySelector(".suggestion-item.active");
        if (active) {
            active.click();
        } else {
            closeSuggestions();
            searchCharacter();
        }
        return;
    }
    if (e.key === "Escape") {
        closeSuggestions();
        return;
    }
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();
        moveSuggestionSelection(e.key === "ArrowDown" ? 1 : -1);
    }
});

document.getElementById("characterSearch").addEventListener("input", function () {
    renderSuggestions(this.value);
});

document.addEventListener("click", function (e) {
    const box = document.getElementById("suggestions");
    const input = document.getElementById("characterSearch");
    if (e.target !== box && e.target !== input && !box.contains(e.target)) {
        closeSuggestions();
    }
});

const ALL_CHARACTERS = Object.keys(CHARACTER_NAMES)
    .map(Number)
    .filter(i => !DEAD_BLOCKS.includes(i))
    .map(i => ({ id: i, name: CHARACTER_NAMES[i], nameLower: CHARACTER_NAMES[i].toLowerCase() }));

function renderSuggestions(query) {
    const box = document.getElementById("suggestions");
    const words = query.toLowerCase().trim().split(/\s+/).filter(Boolean);

    if (words.length === 0) {
        closeSuggestions();
        return;
    }

    const matches = ALL_CHARACTERS
        .filter(c => words.every(w => c.nameLower.includes(w)))
        .slice(0, 8);

    if (matches.length === 0) {
        closeSuggestions();
        return;
    }

    box.innerHTML = matches.map(c => {
        const era = getEraTag(c.name);
        return '<div class="suggestion-item" data-name="' + c.name.replace(/"/g, '&quot;') + '">' +
            '<span class="era-dot" style="background:' + era.color + '"></span>' +
            '<span class="num">#' + c.id + '</span>' + c.name +
        '</div>';
    }).join("");

    box.querySelectorAll(".suggestion-item").forEach(el => {
        el.addEventListener("click", function () {
            const input = document.getElementById("characterSearch");
            input.value = this.getAttribute("data-name");
            closeSuggestions();
            searchCharacter();
        });
    });

    box.classList.add("open");
}

function closeSuggestions() {
    const box = document.getElementById("suggestions");
    box.classList.remove("open");
    box.innerHTML = "";
}

function moveSuggestionSelection(direction) {
    const box = document.getElementById("suggestions");
    const items = Array.from(box.querySelectorAll(".suggestion-item"));
    if (items.length === 0) return;

    let index = items.findIndex(el => el.classList.contains("active"));
    items.forEach(el => el.classList.remove("active"));

    index = (index + direction + items.length) % items.length;
    items[index].classList.add("active");
    items[index].scrollIntoView({ block: "nearest" });
}

</script>

</body>
</html>
